name: Build Images

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/api/openapi.yml'
              - '.github/workflows/build-images.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build-images.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ii1302-8/dockpulse-backend
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # build into the local docker daemon first so we can smoke the exact
      # bytes that would be pushed. push happens in a later step only after
      # smoke passes. catches build-time corruption before it hits ghcr
      - name: Build (load into daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: true
          provenance: false
          sbom: false

      # imports cover the historical failure modes: null bytes in .py source
      # (sqlalchemy/_elements_constructors.py incident) and broken .so
      # relocations (asyncpg/argon2 native extensions). loading app.main
      # forces every router + dependency module to compile
      - name: Smoke - imports (pre-push)
        run: |
          tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker run --rm --entrypoint /bin/sh "$tag" -c '
            set -e
            python -c "import sqlalchemy, asyncpg, argon2, fastapi, pydantic, jwt, alembic"
            SECRET_KEY="$(python -c "import secrets; print(secrets.token_urlsafe(48))")" \
              python -c "from app.main import app; assert app is not None"
            echo "backend imports ok"
          '

      - name: Push to ghcr
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      # round-trip catches registry/network corruption between push and pull
      - name: Smoke - imports (post-push, fresh pull)
        if: github.event_name != 'pull_request'
        run: |
          tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker image rm "$tag" || true
          docker pull "$tag"
          docker run --rm --entrypoint /bin/sh "$tag" -c '
            set -e
            python -c "import sqlalchemy, asyncpg, argon2, fastapi, pydantic, jwt, alembic"
            SECRET_KEY="$(python -c "import secrets; print(secrets.token_urlsafe(48))")" \
              python -c "from app.main import app; assert app is not None"
            echo "backend imports ok after pull"
          '

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ii1302-8/dockpulse-frontend
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (load into daemon)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # nginx -t catches mangled config and truncated binaries; index.html
      # size check catches the build-step output being clobbered
      - name: Smoke - serve assets (pre-push)
        run: |
          tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker run --rm --entrypoint /bin/sh "$tag" -c '
            set -e
            nginx -t
            test -s /usr/share/nginx/html/index.html
            test -s /etc/nginx/conf.d/default.conf
            echo "frontend assets ok"
          '

      - name: Push to ghcr
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Smoke - serve assets (post-push, fresh pull)
        if: github.event_name != 'pull_request'
        run: |
          tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker image rm "$tag" || true
          docker pull "$tag"
          docker run --rm --entrypoint /bin/sh "$tag" -c '
            set -e
            nginx -t
            test -s /usr/share/nginx/html/index.html
            echo "frontend assets ok after pull"
          '

  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success')
    runs-on: [self-hosted, homelab]
    steps:
      - name: Trigger Komodo redeploy
        run: |
          status=$(curl -sS -o /tmp/komodo.out -w "%{http_code}" \
            -X POST http://komodo-core:9120/execute/DeployStack \
            -H "X-Api-Key: ${{ secrets.KOMODO_API_KEY }}" \
            -H "X-Api-Secret: ${{ secrets.KOMODO_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"stack": "69e36a4c42fca375ca446a69"}')
          cat /tmp/komodo.out
          echo
          [ "$status" -lt 400 ] || { echo "Komodo returned HTTP $status"; exit 1; }
