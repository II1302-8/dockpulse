components:
  schemas:
    AdminAlertOut:
      properties:
        alert_id:
          type: string
          title: Alert Id
        berth_id:
          type: string
          title: Berth Id
        type:
          type: string
          title: Type
        message:
          type: string
          title: Message
        acknowledged:
          type: boolean
          title: Acknowledged
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - alert_id
      - berth_id
      - type
      - message
      - acknowledged
      - timestamp
      title: AdminAlertOut
    AdminEventList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminEventOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: AdminEventList
    AdminEventOut:
      properties:
        event_id:
          type: string
          title: Event Id
        berth_id:
          type: string
          title: Berth Id
        harbor_id:
          type: string
          title: Harbor Id
        node_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Node Id
        event_type:
          type: string
          title: Event Type
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        actor_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor User Id
        subject_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject User Id
      type: object
      required:
      - event_id
      - berth_id
      - harbor_id
      - node_id
      - event_type
      - timestamp
      title: AdminEventOut
    AdminInviteOut:
      properties:
        invite_id:
          type: string
          title: Invite Id
        berth_id:
          type: string
          title: Berth Id
        harbor_id:
          type: string
          title: Harbor Id
        email:
          type: string
          title: Email
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - invite_id
      - berth_id
      - harbor_id
      - email
      - status
      - created_at
      - expires_at
      title: AdminInviteOut
    AdoptIn:
      properties:
        qr_payload:
          type: string
          maxLength: 4096
          minLength: 1
          title: Qr Payload
          description: Base64url-encoded JSON from QR fragment (uuid, oob, sn, jwt)
        berth_id:
          type: string
          title: Berth Id
          examples:
          - berth-001
        gateway_id:
          type: string
          title: Gateway Id
          examples:
          - gw-dock-a
      type: object
      required:
      - qr_payload
      - berth_id
      - gateway_id
      title: AdoptIn
    AdoptionAdminOut:
      properties:
        request_id:
          type: string
          title: Request Id
        mesh_uuid:
          type: string
          title: Mesh Uuid
        serial_number:
          type: string
          title: Serial Number
        gateway_id:
          type: string
          title: Gateway Id
        berth_id:
          type: string
          title: Berth Id
        status:
          type: string
          title: Status
          examples:
          - pending
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_msg:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Msg
        expires_at:
          type: string
          format: date-time
          title: Expires At
        created_at:
          type: string
          format: date-time
          title: Created At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      type: object
      required:
      - request_id
      - mesh_uuid
      - serial_number
      - gateway_id
      - berth_id
      - status
      - expires_at
      - created_at
      title: AdoptionAdminOut
    AdoptionCancelOut:
      properties:
        request_id:
          type: string
          title: Request Id
        status:
          type: string
          title: Status
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
      type: object
      required:
      - request_id
      - status
      title: AdoptionCancelOut
    AdoptionPipelineStatus:
      properties:
        pending:
          type: integer
          title: Pending
          description: Pending adoption requests
          examples:
          - 0
        err_last_15min:
          type: integer
          title: Err Last 15Min
          description: Failed adoptions in the last 15 minutes
          examples:
          - 0
      type: object
      required:
      - pending
      - err_last_15min
      title: AdoptionPipelineStatus
    AdoptionRequestOut:
      properties:
        request_id:
          type: string
          title: Request Id
          examples:
          - req-0001
        mesh_uuid:
          type: string
          title: Mesh Uuid
          examples:
          - a1b2c3d4-e5f6-7890-abcd-ef1234567890
        serial_number:
          type: string
          title: Serial Number
          examples:
          - DP-N-000123
        gateway_id:
          type: string
          title: Gateway Id
          examples:
          - gw-dock-a
        berth_id:
          type: string
          title: Berth Id
          examples:
          - berth-001
        status:
          type: string
          enum:
          - pending
          - ok
          - err
          title: Status
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          examples:
          - timeout
        error_msg:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Msg
          examples:
          - node did not respond
        mesh_unicast_addr:
          anyOf:
          - type: string
          - type: 'null'
          title: Mesh Unicast Addr
          examples:
          - '0x0042'
        expires_at:
          type: string
          format: date-time
          title: Expires At
          examples:
          - '2026-05-03T14:35:00Z'
        created_at:
          type: string
          format: date-time
          title: Created At
          examples:
          - '2026-05-03T14:30:00Z'
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
          examples:
          - '2026-05-03T14:31:00Z'
      type: object
      required:
      - request_id
      - mesh_uuid
      - serial_number
      - gateway_id
      - berth_id
      - status
      - expires_at
      - created_at
      title: AdoptionRequestOut
    AdoptionStateEvent:
      properties:
        type:
          type: string
          const: adoption.state
          title: Type
          default: adoption.state
        request_id:
          type: string
          title: Request Id
        state:
          type: string
          title: State
          description: Provisioning phase reported by the gateway
          examples:
          - link-open
      type: object
      required:
      - request_id
      - state
      title: AdoptionStateEvent
    AdoptionUpdateEvent:
      properties:
        type:
          type: string
          const: adoption.update
          title: Type
          default: adoption.update
        request:
          $ref: '#/components/schemas/AdoptionRequestOut'
      type: object
      required:
      - request
      title: AdoptionUpdateEvent
    AlertOut:
      properties:
        alert_id:
          type: string
          title: Alert Id
          examples:
          - alrt-0001
        berth_id:
          type: string
          title: Berth Id
          examples:
          - berth-001
        type:
          type: string
          enum:
          - unauthorized_mooring
          - sensor_offline
          - low_battery
          title: Type
        message:
          type: string
          title: Message
          examples:
          - Battery below 15%
        acknowledged:
          type: boolean
          title: Acknowledged
          default: false
        timestamp:
          type: string
          format: date-time
