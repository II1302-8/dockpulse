        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cf-Access-Jwt-Assertion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
