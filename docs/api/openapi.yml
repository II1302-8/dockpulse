      tags:
      - adoptions
      summary: Subscribe to adoption progress via Server-Sent Events
      description: Opens a long-lived `text/event-stream` for a single adoption request.
        The first frame is a snapshot of the current state. Subsequent frames are
        `AdoptionUpdateEvent` (DB-backed terminal/snapshot transitions) or `AdoptionStateEvent`
        (advisory phase events forwarded from the gateway). The stream closes once
        the request reaches a terminal state (`ok` or `err`).
      operationId: streamAdoption
