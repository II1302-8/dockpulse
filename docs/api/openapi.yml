      - APIKeyCookie: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Each frame is a JSON-encoded AdoptionUpdateEvent or AdoptionStateEvent.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AdoptionUpdateEvent'
                - $ref: '#/components/schemas/AdoptionStateEvent'
                title: Response 200 Streamadoption
        '404':
          description: Adoption request not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
