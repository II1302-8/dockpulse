<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d6e8fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DockPulse" />
    <title>DockPulse</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // pauses body wave animations when tab is hidden; toggled on <html>
      // so css can suspend animation-play-state without touching react
      (function () {
        var root = document.documentElement;
        function sync() {
          root.classList.toggle("waves-paused", document.hidden);
        }
        document.addEventListener("visibilitychange", sync);
        sync();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
